name: Deploy Klubnika Cafe to Hostinger

on:
  push:
    branches:
      - main # Change to 'master' if your main branch uses master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Navigate to project directory
            cd /root/KlubnikaCafe

            # Hard reset local server changes to prevent merge conflicts
            git fetch origin main
            git reset --hard origin/main

            # --- Backend Setup ---
            cd /root/KlubnikaCafe/backend
            npm install --production
            
            # Restart PM2 process by pattern match or restart all
            pm2 restart klubnika-cafe-backend || pm2 restart klubnika-cafe-bac || pm2 start index.js --name "klubnika-cafe-backend"

            # --- Frontend Setup ---
            cd /root/KlubnikaCafe/frontend
            npm install
            npm run build

            # Save PM2 state
            pm2 save
